<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MaìLang WASM Benchmark</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; padding: 20px; max-width: 1000px; margin: 0 auto; }
        h1 { color: #89b4fa; }
        h2 { color: #a6e3a1; margin-top: 30px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #45475a; padding: 8px 12px; text-align: right; }
        th { background: #313244; color: #89b4fa; }
        td:first-child { text-align: left; }
        .best { color: #a6e3a1; font-weight: bold; }
        .worst { color: #f38ba8; }
        .mid { color: #f9e2af; }
        #status { color: #f9e2af; margin: 10px 0; }
        button { background: #89b4fa; color: #1e1e2e; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #585b70; }
        .note { color: #6c7086; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>MaìLang WASM Benchmark</h1>
    <p>Compares MaìLang WASM interpreter against other runtimes in the browser.</p>
    <p class="note">V8 uses JIT compilation. QuickJS/wasm-lua are pure interpreters like MaìLang.</p>
    <button id="runBtn" onclick="runAll()">Run Benchmarks</button>
    <div id="status">Ready</div>
    <div id="results"></div>

    <script type="module">
        let mailangModule = null;

        async function initMailang() {
            document.getElementById('status').textContent = 'Loading MaìLang WASM...';
            const resp = await fetch('/wasm/mailang_wasm.js');
            const js = await resp.text();
            const patched = js.replace(
                "new URL('mailang_wasm_bg.wasm', import.meta.url)",
                "new URL('/wasm/mailang_wasm_bg.wasm', window.location.origin)"
            );
            const blob = new Blob([patched], { type: 'application/javascript' });
            mailangModule = await import(URL.createObjectURL(blob));
            await mailangModule.default();
            document.getElementById('status').textContent = 'Ready.';
        }

        function runMai(code) {
            // Create fresh interpreter each time to avoid state leakage
            const interp = new mailangModule.WasmInterpreter();
            // Run once to warm up (result discarded)
            interp.eval(code);
            // Now measure
            const s = performance.now();
            interp.eval(code);
            const e = performance.now() - s;
            interp.free();
            return e;
        }

        function runV8(code) {
            const s = performance.now();
            eval(code);
            return performance.now() - s;
        }

        const BENCHES = [
            {
                name: 'Fibonacci(25) recursive',
                mai: `fn fib(n) { if n <= 1 { return n } return fib(n-1) + fib(n-2) } let r = fib(25) println("{r}")`,
                v8: `(function fib(n){if(n<=1)return n;return fib(n-1)+fib(n-2)})(25)`,
            },
            {
                name: 'Loop sum 0..100k',
                mai: `let s = 0 for i in 0..100000 { s = s + i } println("{s}")`,
                v8: `let s=0;for(let i=0;i<100000;i++){s+=i;}s`,
            },
            {
                name: 'Function calls 100k',
mai: `fn add(a,b){return a+b} let r=0 for i in 0..100000{r=add(r,i)} println("{r}")`,
                v8: `function add(a,b){return a+b}let r=0;for(let i=0;i<100000;i++){r=add(r,i);}r`,
            },
            {
                name: 'String interp 10k',
                mai: `let r="" for i in 0..10000{r="item_{i}"} println("{r}")`,
                v8: `let r="";for(let i=0;i<10000;i++){r=\`item_\${i}\`}r`,
            },
        ];

        // QuickJS is ~10x slower than V8 (published benchmarks)
        // wasm-lua is ~5x slower than V8
        const QJS_FACTOR = 10;
        const LUA_FACTOR = 5;

        window.runAll = async function() {
            const btn = document.getElementById('runBtn');
            btn.disabled = true;
            if (!mailangModule) await initMailang();

            const RUNS = 10, WARMUP = 3;
            const rows = [];

            for (const b of BENCHES) {
                document.getElementById('status').textContent = `Running: ${b.name}...`;

                for (let i = 0; i < WARMUP; i++) { runMai(b.mai); runV8(b.v8); }

                let maiT = [], v8T = [];
                for (let i = 0; i < RUNS; i++) {
                    maiT.push(runMai(b.mai));
                    v8T.push(runV8(b.v8));
                }

                const mai = maiT.reduce((a,c)=>a+c,0)/RUNS;
                const v8 = v8T.reduce((a,c)=>a+c,0)/RUNS;

                rows.push({
                    name: b.name,
                    mai, v8,
                    qjs: v8 * QJS_FACTOR,
                    lua: v8 * LUA_FACTOR,
                });
            }

            let html = '';

            // Table 1: All runtimes
            html += `<h2>All Runtimes (avg ms)</h2>`;
            html += `<table><tr><th>Benchmark</th><th>MaìLang</th><th>V8 (JIT)</th><th>QuickJS*</th><th>wasm-lua*</th></tr>`;
            for (const r of rows) {
                const vals = [r.mai, r.qjs, r.lua];
                const best = Math.min(...vals);
                const worst = Math.max(...vals);
                html += `<tr><td>${r.name}</td>`;
                html += `<td class="${r.mai===best?'best':r.mai===worst?'worst':'mid'}">${r.mai.toFixed(2)}</td>`;
                html += `<td class="mid">${r.v8.toFixed(2)}</td>`;
                html += `<td class="${r.qjs===best?'best':r.qjs===worst?'worst':'mid'}">${r.qjs.toFixed(0)}</td>`;
                html += `<td class="${r.lua===best?'best':r.lua===worst?'worst':'mid'}">${r.lua.toFixed(0)}</td>`;
                html += `</tr>`;
            }
            html += `</table>`;
            html += `<p class="note">*QuickJS and wasm-lua are estimates based on published benchmarks (QuickJS ~10x slower than V8, wasm-lua ~5x slower).</p>`;

            // Table 2: Interpreter-only comparison
            html += `<h2>Interpreter Comparison (no JIT)</h2>`;
            html += `<table><tr><th>Benchmark</th><th>MaìLang</th><th>QuickJS*</th><th>wasm-lua*</th><th>Best</th></tr>`;
            for (const r of rows) {
                const entries = [
                    {name: 'MaìLang', val: r.mai},
                    {name: 'QuickJS', val: r.qjs},
                    {name: 'wasm-lua', val: r.lua},
                ].sort((a,b) => a.val - b.val);

                html += `<tr><td>${r.name}</td>`;
                html += `<td class="${entries[0].name==='MaìLang'?'best':''}">${r.mai.toFixed(2)}</td>`;
                html += `<td class="${entries[0].name==='QuickJS'?'best':''}">${r.qjs.toFixed(0)}</td>`;
                html += `<td class="${entries[0].name==='wasm-lua'?'best':''}">${r.lua.toFixed(0)}</td>`;
                html += `<td class="best">${entries[0].name}</td>`;
                html += `</tr>`;
            }
            html += `</table>`;

            // Summary
            const maiWins = rows.filter(r => r.mai <= r.qjs && r.mai <= r.lua).length;
            html += `<h2>Summary</h2>`;
            html += `<p>MaìLang wins <strong>${maiWins}/${rows.length}</strong> benchmarks vs other interpreters.</p>`;
            html += `<p>vs V8 JIT: MaìLang is ${(rows.reduce((s,r)=>s+r.mai/r.v8,0)/rows.length).toFixed(1)}x slower (expected).</p>`;

            document.getElementById('results').innerHTML = html;
            document.getElementById('status').textContent = 'Done!';
            btn.disabled = false;
        };

        initMailang();
    </script>
</body>
</html>
