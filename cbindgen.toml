language = "C"
include_guard = "MAILANG_H"
autogen_warning = "// This file is auto-generated by cbindgen. Do not edit manually."
documentation = true
documentation_style = "doxy"
line_length = 100
tab_width = 4
 braces = "SameLine"
[defines]
"feature = std" = "MAILANG_STD"
"feature = gc" = "MAILANG_GC"
