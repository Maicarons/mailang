[package]
name = "mailang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for MaìLang"

[[bin]]
name = "mailang"
path = "src/main.rs"

[dependencies]
mailang-core = { path = "../mailang-core", version = "0.4.0" }
mailang-module = { path = "../mailang-module", version = "0.4.0" }
mailang-lsp = { path = "../mailang-lsp", version = "0.4.0" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[target.x86_64-pc-windows-msvc.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }
