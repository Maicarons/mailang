[package]
name = "mailang-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library integrating all MaìLang components"

[dependencies]
mailang-lexer = { path = "../mailang-lexer", version = "0.3.1" }
mailang-parser = { path = "../mailang-parser", version = "0.3.1" }
mailang-ast = { path = "../mailang-ast", version = "0.3.1" }
mailang-compiler = { path = "../mailang-compiler", version = "0.3.1" }
mailang-bytecode = { path = "../mailang-bytecode", version = "0.3.1" }
mailang-vm = { path = "../mailang-vm", version = "0.3.1" }
mailang-stdlib = { path = "../mailang-stdlib", version = "0.3.1" }
mailang-module = { path = "../mailang-module", version = "0.3.1" }
mailang-analyzer = { path = "../mailang-analyzer", version = "0.3.1" }

[features]
default = ["std", "gc"]
std = ["mailang-vm/std"]
alloc = ["mailang-vm/alloc"]
gc = ["mailang-vm/gc"]
