name: Bug Report
description: Report a bug in MaìLang
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.
  - type: input
    id: version
    attributes:
      label: MaìLang Version
      description: Output of `mailang --version` or the git commit hash
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - WASM
        - Embedded (ARM)
        - Embedded (RISC-V)
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Reproduction Code
      description: Minimal MaìLang code that reproduces the bug
      render: mai
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Include any error messages or stack traces
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information
