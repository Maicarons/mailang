name: Bindings

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ffi:
    name: Build FFI Library
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build FFI
        run: cargo build --release -p mailang-ffi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailang-ffi-${{ matrix.os }}
          path: target/release/*mailang_ffi*

  test-python:
    name: Python Binding
    runs-on: ubuntu-latest
    needs: build-ffi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mailang-ffi-ubuntu-latest
          path: target/release/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python bindings/python/test_binding.py
        continue-on-error: true

  build-wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM
        run: cargo build --release -p mailang-wasm --target wasm32-unknown-unknown
