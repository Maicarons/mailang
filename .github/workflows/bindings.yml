name: Bindings

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ffi:
    name: Build FFI Library
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build FFI
        run: cargo build --release -p mailang-ffi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mailang-ffi-${{ matrix.os }}
          path: target/release/*mailang_ffi*

  test-python-binding:
    name: Python Binding
    runs-on: ubuntu-latest
    needs: build-ffi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mailang-ffi-ubuntu-latest
          path: target/release/
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test
        run: python bindings/python/test_binding.py
        continue-on-error: true

  ffi-smoke-tests:
    name: FFI smoke (C / Python / Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build FFI library (debug)
        run: cargo build -p mailang-ffi
      - name: Build CLI (for Node smoke)
        run: cargo build -p mailang-cli
      - name: C FFI compile-check + link + run
        run: |
          gcc -Wall -Wextra -Werror -I crates/mailang-ffi/include \
            -o /tmp/test_c ffi/tests/test_c.c \
            -L target/debug -lmailang_ffi -Wl,-rpath,target/debug
          /tmp/test_c
      - name: Python ctypes smoke
        run: python ffi/tests/test_python.py
      - name: Node smoke
        run: node ffi/tests/test_node.js

  build-wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM
        run: cargo build --release -p mailang-wasm --target wasm32-unknown-unknown
