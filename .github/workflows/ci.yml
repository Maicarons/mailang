name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace

  host-packs:
    name: Packs (host=${{ matrix.host }}, vm=${{ matrix.vm }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # `test_*` asserts the pure-Mai simulation (the default, no host
        # installed); `host_*` asserts that a real host backend took over. Each
        # is crossed with the VM backends: `default` passes no `--vm` flag (the
        # register VM since M5), `stack` / `register` name it explicitly. The
        # packs are part of the dual-VM equivalence gate, so every suite must
        # pass on both backends alike.
        include:
          - host: sim
            vm: default
            tests: libs\tui\test\test_tui.mai libs\gui\test\test_gui.mai libs\mqtt\test\test_mqtt.mai libs\bme280\test\test_bme280.mai
          - host: sim
            vm: stack
            tests: libs\tui\test\test_tui.mai libs\gui\test\test_gui.mai libs\mqtt\test\test_mqtt.mai libs\bme280\test\test_bme280.mai
          - host: sim
            vm: register
            tests: libs\tui\test\test_tui.mai libs\gui\test\test_gui.mai libs\mqtt\test\test_mqtt.mai libs\bme280\test\test_bme280.mai
          - host: tui
            vm: default
            tests: libs\tui\test\host_tui.mai
          - host: tui
            vm: stack
            tests: libs\tui\test\host_tui.mai
          - host: tui
            vm: register
            tests: libs\tui\test\host_tui.mai
          - host: gui
            vm: default
            tests: libs\gui\test\host_gui.mai
          - host: gui
            vm: stack
            tests: libs\gui\test\host_gui.mai
          - host: gui
            vm: register
            tests: libs\gui\test\host_gui.mai
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p mailang-cli
      - name: Pack tests
        shell: pwsh
        run: |
          $vmArgs = @()
          if ("${{ matrix.vm }}" -ne "default") { $vmArgs += "--vm=${{ matrix.vm }}" }
          foreach ($t in "${{ matrix.tests }}".Split(" ")) {
            Write-Host "== $t  (--host=${{ matrix.host }} $($vmArgs -join ' '))"
            & .\target\release\mailang.exe run @vmArgs --host=${{ matrix.host }} $t
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  test:
    name: Test (${{ matrix.vm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `default` runs with `MAILANG_VM` unset, i.e. on the backend a user
        # gets out of the box - the register VM since M5, asserted by
        # `test_default_backend_is_register`. `stack` is the documented opt-out,
        # so the two rows still cover both backends. The explicit
        # `MAILANG_VM=register` spelling is covered by the CLI unit tests.
        vm: [default, stack]
    env:
      MAILANG_VM: ${{ matrix.vm == 'stack' && 'stack' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  bench:
    name: Bench fib30 (${{ matrix.vm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `default` is the flagless run (`MAILANG_VM` unset), `stack` /
        # `register` name the backend explicitly.
        vm: [default, stack, register]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p mailang-cli
      # Informational baseline for ROADMAP M1 (register VM <= 2x stack).
      - name: Time fib30
        run: |
          if [ "${{ matrix.vm }}" = "default" ]; then
            BIN="./target/release/mailang run bench_fib30.mai"
          else
            BIN="./target/release/mailang run --vm=${{ matrix.vm }} bench_fib30.mai"
          fi
          START=$(date +%s%N)
          $BIN > /dev/null
          END=$(date +%s%N)
          echo "fib30 (${{ matrix.vm }}): $(( (END - START) / 1000000 )) ms"
      # Behavioural equivalence gate: every example / library program must
      # produce identical output on both backends. Programs that are known to
      # differ are listed in benchmark/known_backend_mismatches.txt (ROADMAP
      # Phase M 13.3 / 13.5); a mismatch outside that list fails the job.
      - name: Compare backends on real programs
        if: matrix.vm == 'default'
        run: pwsh benchmark/compare_backends.ps1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace -- -D warnings

  cross:
    name: Cross Compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Full workspace (std) only — bare-metal targets are covered by no_std below.
        target:
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --workspace --target ${{ matrix.target }} --exclude mailang-wasm --exclude mailang-lsp --exclude mailang-ffi

  no_std:
    name: no_std bytecode (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check mailang-bytecode no_std
        run: cargo check -p mailang-bytecode --no-default-features --target ${{ matrix.target }}
      - name: Report rlib size
        run: |
          cargo build --release -p mailang-bytecode --no-default-features --target ${{ matrix.target }}
          ls -la target/${{ matrix.target }}/release/libmailang_bytecode.rlib

  driver-host-packs:
    name: Driver packs (real transport, vm=${{ matrix.vm }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vm: default
          - vm: stack
          - vm: register
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p mailang-cli
      - name: Host suites (real TCP transport / CSV sensor feed)
        shell: pwsh
        run: |
          $vmArgs = @()
          if ("${{ matrix.vm }}" -ne "default") { $vmArgs += "--vm=${{ matrix.vm }}" }
          $broker = Start-Process -FilePath ".\target\release\mailang.exe" -ArgumentList 'mqtt-broker','--port','1883' -PassThru -RedirectStandardOutput broker.log -RedirectStandardError broker.err
          try {
            $ok = $false
            foreach ($i in 1..50) {
              try { $c = New-Object Net.Sockets.TcpClient; $c.Connect('127.0.0.1', 1883); $c.Close(); $ok = $true; break } catch { Start-Sleep -Milliseconds 200 }
            }
            if (-not $ok) { Get-Content broker.log, broker.err -ErrorAction SilentlyContinue; throw 'mqtt dev broker did not start' }
            & .\target\release\mailang.exe run @vmArgs --mqtt libs\mqtt\test\host_mqtt.mai
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\target\release\mailang.exe run @vmArgs --bme280-feed=libs\bme280\test\feed.csv libs\bme280\test\host_bme280.mai
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if ($broker -and -not $broker.HasExited) { $broker.Kill() }
          }

  bytecode-format:
    name: Bytecode format tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p mailang-bytecode
      - name: CLI build/run roundtrip
        run: |
          cargo build -p mailang-cli
          ./target/debug/mailang build examples/hello.mai -o /tmp/hello.mailangbc
          # `.mailangbc` is backend-independent: the flagless run is the
          # register VM (M5 default), and it must agree with `--vm=stack`.
          ./target/debug/mailang run /tmp/hello.mailangbc > /tmp/hello.default.txt
          ./target/debug/mailang run --vm=stack /tmp/hello.mailangbc > /tmp/hello.stack.txt
          diff /tmp/hello.default.txt /tmp/hello.stack.txt
          cat /tmp/hello.default.txt

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Leaf crates only: packages that depend on unpublished workspace
      # versions fail dry-run resolution until the release workflow publishes them.
      - name: Dry-run publish mailang-bytecode
        run: cargo publish --dry-run --no-verify -p mailang-bytecode
      - name: Dry-run publish mailang-ast
        run: cargo publish --dry-run --no-verify -p mailang-ast
      - name: Dry-run publish mailang-core (tolerate unpublished deps)
        continue-on-error: true
        run: cargo publish --dry-run --no-verify -p mailang-core

