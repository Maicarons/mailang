name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace

  host-packs:
    name: Packs (host=${{ matrix.host }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Each test suite asserts one backend, so they pair up rather than
        # crossing: `test_*` asserts the pure-Mai simulation (the default, no
        # host installed) and must run under `sim`, while `host_*` asserts that
        # a real backend took over and therefore needs its own host.
        include:
          - host: sim
            tests: libs\tui\test\test_tui.mai libs\gui\test\test_gui.mai
          - host: tui
            tests: libs\tui\test\host_tui.mai
          - host: gui
            tests: libs\gui\test\host_gui.mai
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p mailang-cli
      - name: Pack tests
        shell: pwsh
        run: |
          foreach ($t in "${{ matrix.tests }}".Split(" ")) {
            Write-Host "== $t  (--host=${{ matrix.host }})"
            .\target\release\mailang.exe run --host=${{ matrix.host }} $t
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  test:
    name: Test (${{ matrix.vm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every test runs on both backends: `MAILANG_VM=register` switches the
        # suite to the register VM, which is the equivalence gate required
        # before any default-backend switch.
        vm: [stack, register]
    env:
      MAILANG_VM: ${{ matrix.vm == 'register' && 'register' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  bench:
    name: Bench fib30 (${{ matrix.vm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vm: [stack, register]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p mailang-cli
      # Informational baseline for ROADMAP M1 (register VM <= 2x stack).
      - name: Time fib30
        run: |
          if [ "${{ matrix.vm }}" = "register" ]; then
            BIN="./target/release/mailang run --vm=register bench_fib30.mai"
          else
            BIN="./target/release/mailang run bench_fib30.mai"
          fi
          START=$(date +%s%N)
          $BIN > /dev/null
          END=$(date +%s%N)
          echo "fib30 (${{ matrix.vm }}): $(( (END - START) / 1000000 )) ms"
      # Behavioural equivalence gate: every example / library program must
      # produce identical output on both backends. Programs that are known to
      # differ are listed in benchmark/known_backend_mismatches.txt (ROADMAP
      # Phase M 13.3 / 13.5); a mismatch outside that list fails the job.
      - name: Compare backends on real programs
        if: matrix.vm == 'stack'
        run: pwsh benchmark/compare_backends.ps1

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace -- -D warnings

  cross:
    name: Cross Compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Full workspace (std) only — bare-metal targets are covered by no_std below.
        target:
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --workspace --target ${{ matrix.target }} --exclude mailang-wasm --exclude mailang-lsp --exclude mailang-ffi

  no_std:
    name: no_std bytecode (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check mailang-bytecode no_std
        run: cargo check -p mailang-bytecode --no-default-features --target ${{ matrix.target }}
      - name: Report rlib size
        run: |
          cargo build --release -p mailang-bytecode --no-default-features --target ${{ matrix.target }}
          ls -la target/${{ matrix.target }}/release/libmailang_bytecode.rlib

  bytecode-format:
    name: Bytecode format tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p mailang-bytecode
      - name: CLI build/run roundtrip
        run: |
          cargo build -p mailang-cli
          ./target/debug/mailang build examples/hello.mai -o /tmp/hello.mailangbc
          ./target/debug/mailang run /tmp/hello.mailangbc

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Leaf crates only: packages that depend on unpublished workspace
      # versions fail dry-run resolution until the release workflow publishes them.
      - name: Dry-run publish mailang-bytecode
        run: cargo publish --dry-run --no-verify -p mailang-bytecode
      - name: Dry-run publish mailang-ast
        run: cargo publish --dry-run --no-verify -p mailang-ast
      - name: Dry-run publish mailang-core (tolerate unpublished deps)
        continue-on-error: true
        run: cargo publish --dry-run --no-verify -p mailang-core

