name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mailang
            archive: mailang-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: mailang
            archive: mailang-aarch64-unknown-linux-gnu.tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mailang.exe
            archive: mailang-x86_64-pc-windows-msvc.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: mailang
            archive: mailang-aarch64-apple-darwin.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: mailang
            archive: mailang-x86_64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross (Linux aarch64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build release (cross)
        if: matrix.cross
        run: cross build --release -p mailang-cli --target ${{ matrix.target }}
      - name: Build release
        if: '!matrix.cross'
        # Always pass --target so the binary lands in target/<triple>/release/
        run: cargo build --release -p mailang-cli --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          staging="mailang-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$staging/"
          cp README.md LICENSE-APACHE "$staging/" 2>/dev/null || true
          tar czf "${{ matrix.archive }}" "$staging"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "mailang-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" $staging/
          Copy-Item README.md $staging/ -ErrorAction SilentlyContinue
          Compress-Archive -Path $staging -DestinationPath "${{ matrix.archive }}" -Force
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          files: dist/*

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crates.io token
        id: token
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CARGO_REGISTRY_TOKEN secret is not set; skipping crates.io publish."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to crates.io
        if: steps.token.outputs.present == 'true'
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish mailang-ast
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-ast --allow-dirty
      - name: Publish mailang-bytecode
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-bytecode --allow-dirty
      - name: Publish mailang-lexer
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-lexer --allow-dirty
      - name: Publish mailang-stdlib
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-stdlib --allow-dirty
      - name: Publish mailang-gc
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-gc --allow-dirty
      - name: Publish mailang-parser
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-parser --allow-dirty
      - name: Publish mailang-analyzer
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-analyzer --allow-dirty
      - name: Publish mailang-compiler
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-compiler --allow-dirty
      - name: Publish mailang-vm
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-vm --allow-dirty
      - name: Publish mailang-core
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-core --allow-dirty
      - name: Publish mailang-macros
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-macros --allow-dirty
      - name: Publish mailang-cli
        if: steps.token.outputs.present == 'true'
        run: cargo publish -p mailang-cli --allow-dirty
